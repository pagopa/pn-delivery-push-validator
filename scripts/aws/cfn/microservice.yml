AWSTemplateFormatVersion: 2010-09-09
Description: 'Example microservice deploy'

Parameters:
  ProjectName:
    Type: String
    Description: 'Usually pn can be pnXYZ where XYZ are the feature number, useful to create
      experimental environments without crash official development environment'

  AlarmSNSTopicArn:
    Type: String
    Description: ARN of alarm topic

  ContainerImageUri:
    Type: String
    Description: 'Exact container image URI with full repository and image digest'

  MicroserviceNumber:
    Type: Number
    Description: 'Disambiguation useful for load balancer rules'

  TemplateBucketBaseUrl:
    Type: String
    Description: 'The S3 bucket from which to fetch the templates used by this stack.'

  ECSClusterName:
    Type: String
    Description: 'The name of the ECS cluster where the microservice is going to be deployed'

  SubnetsIds:
    Type: CommaDelimitedList
    Description: 'subnets ids comma separated list. Where to deploy the microservice'

  VpcId:
    Type: String
    Description: 'VpcId where the microservice is going to be deployed'
  
  EcsDefaultSecurityGroup:
    Type: String
    Description: 'Default security group required by infrastructure'

  ApplicationLoadBalancerListenerArn:
    Type: String
    Description: 'Load balancer listener where HTTP endpoints is going to be registered'

  ApplicationLoadBalancerDomain:
    Type: String
    Description: 'Base URL of the load balancer where the service is going to be reachable'

  NetworkLoadBalancerLink:
    Type: String
    Description: 'network load balancer link for API-GW'
  
  LogsKinesisSourceStreamArn:
    Type: String
    Description: 'Kinesis stream that receive logs'
  
  Version:
    Type: String
    Description: 'keep track of used projects commitIds'

  # Instance parameters
  # 256 (.25 vCPU) - Available memory values: 0.5GB, 1GB, 2GB
  # 512 (.5 vCPU) - Available memory values: 1GB, 2GB, 3GB, 4GB
  # 1024 (1 vCPU) - Available memory values: 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB
  # 2048 (2 vCPU) - Available memory values: Between 4GB and 16GB in 1GB increments
  # 4096 (4 vCPU) - Available memory values: Between 8GB and 30GB in 1GB increments
  CpuValueValidator:
    Type: Number
    Default: 1024
    Description: Fargate virtual CPU quantity 1024 equals one vCPU (Validator task)

  # 0.5GB, 1GB, 2GB - Available cpu values: 256 (.25 vCPU)
  # 1GB, 2GB, 3GB, 4GB - Available cpu values: 512 (.5 vCPU)
  # 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB - Available cpu values: 1024 (1 vCPU)
  # Between 4GB and 16GB in 1GB increments - Available cpu values: 2048 (2 vCPU)
  # Between 8GB and 30GB in 1GB increments - Available cpu values: 4096 (4 vCPU)
  MemoryAmountValidator:
    Type: String
    Default: 2GB
    Description: memory amount reserved to the task pod (Validator task)
    AllowedValues: [ 2GB, 4GB, 6GB, 8GB ]

  HealthCheckTimeout:
    Description: health check timeout seconds
    Type: Number
    Default: 5

  # Heath Check parameters
  HealthCheckInterval:
    Description: Seconds between two health check
    Type: Number
    Default: 60

  HealthyThresholdCount:
    Description: |
      The number of consecutive health checks successes required before considering
      an unhealthy target healthy.
    Type: Number
    Default: 5

  UnhealthyThresholdCount:
    Description: |
      The number of consecutive health check failures required before considering a target unhealthy.
    Type: Number
    Default: 2

  AutoscalingThresholdValidator:
    Default: 70
    Type: String

  # Logging parameters
  WireTapLogActivation:
    Type: String
    Default: false
    Description: Activation of wire logs
    AllowedValues:
      - true
      - false

  PnCronAnalyzer:
    Type: String
    Default: '-'
    Description: Cron for which you send the metric to CloudWatch

  # EFS parameters
  FargateEFSFileSystemID:
    Type: String
    Description: "EFS Filesystem"

  MountEfs:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  # Autoscaling parameters
  AutoscalingCheckPeriod:
    Default: 60
    Type: Number
    Description: minimum autoscaling number of tasks

  MinTasksNumberValidator:
    Default: 1
    Type: Number
    Description: minimum autoscaling number of tasks (Validator task)

  MaxTasksNumberValidator:
    Default: 6
    Type: Number
    Description: maximum autoscaling number of tasks (Validator task)

  AutoscalingDataPointValidatorN:
    Default: 1
    Type: Number
    Description: activate when N datapoint on M (Validator task)

  AutoscalingDataPointValidatorM:
    Default: 1
    Type: Number
    Description: activate when N datapoint on M (Validator task)

  ApplicativeEnvFileChecksum:
    Type: String
    Default: ''
    Description: 'Applicative environment variable file checksum'

  # --- Dynamo Table ---
  DocumentCreationRequestTableName:
    Type: String
    Description: 'Name of dynamodb table containing unreacheble notifications recipients'

  ConsumedQueueMessagePerMinuteValidator:
    Type: Number
    Default: 0
    Description: Weight to assign to queue number of visible messages metric (Validator task)

  ApplicationLoadBalancerMetricsDimensionName:
    Type: String
    Default: ''
    Description: Application load balancer dimension name

  AlbSecurityGroup:
    Type: String
    Description: 'Application load balancer security group'

  ScheduledValidationActionsQueueName:
    Type: String
    Description: 'Send and pull ready-to-do actions th this queue'

  SafeStorageToDeliveryPushQueueName:
    Type: String
    Description: 'SafeStorage-to-delivery-push queue Name'

  SafeStorageToDeliveryPushQueueARN:
    Type: String
    Description: 'SafeStorage-to-delivery-push queue ARN'

  SafeStorageToDeliveryPushQueueAlarmARN:
    Type: String
    Description: SafeStorage-to-delivery-push queue alarm ARN

  SafeStorageToDeliveryPushQueueAgeAlarmARN:
    Type: String
    Description: SafeStorage-to-delivery-push queue age alarm ARN

  AddressManagerToDeliveryPushQueueName:
    Type: String
    Description: 'AddressManager-to-delivery-push queue Name'

  F24ToDeliveryPushQueueName:
    Type: String
    Description: F24-to-delivery-push Queue Name

  F24ToDeliveryPushQueueARN:
    Type: String
    Description: F24-to-delivery-push queue ARN

  F24ToDeliveryPushQueueAlarmARN:
    Type: String
    Description: F24-to-delivery-push queue alarm ARN

  F24ToDeliveryPushQueueAgeAlarmARN:
    Type: String
    Description: F24-to-delivery-push queue age alarm ARN

  AddressManagerToDeliveryPushQueueARN:
    Type: String
    Description: AddressManager-to-delivery-push queue ARN

  AddressManagerToDeliveryPushQueueAlarmARN:
    Type: String
    Description: AddressManager-to-delivery-push queue alarm ARN

  AddressManagerToDeliveryPushQueueAgeAlarmARN:
    Type: String
    Description: AddressManager-to-delivery-push queue age alarm ARN

  ScheduledValidationActionsQueueAlarmARN:
    Type: String
    Description: delivery push validation actions queue dlq alarm ARN

  DeliveryPushValidationInputsQueueName:
    Type: String
    Description: DeliveryPushValidationInputsQueue queue name

  DeliveryPushValidationInputsQueueARN:
    Type: String
    Description: DeliveryPushValidationInputsQueue queue ARN

  DeliveryPushValidationInputsQueueAlarmARN:
    Type: String
    Description: DeliveryPushValidationInputsQueue alarm ARN

  DeliveryPushValidationInputsQueueAgeAlarmARN:
    Type: String
    Description: DeliveryPushValidationInputsQueue age alarm ARN

  SandboxSafeStorageBaseUrl:
    Type: String
    Description: 'Safe storage base url'

  F24DeliveryPushUser:
    Type: String
    Description: 'pn-delivery-push clientId for communication with pn-f24'

  # Log group parameters
  EcsValidatorLogGroup:
    Type: String
    Description: 'Ecs log group name (Validator task)'
    
  LogAlarmStrategy:
    Type: String
    Default: 'FATAL'

  ValidationActionQueueDetailType:
    Type: CommaDelimitedList
    Default: ''
    Description: 'List of action detail type to accept in event bridge rule'

Resources:

  # PN-Delivery-push validator microservice
  DeliveryPushValidatorMicroservice:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/ecs-service.yaml"
      Parameters:
        MicroServiceUniqueName: !Sub '${ProjectName}-delivery-push-validator-service'
        CpuValue: !Ref CpuValueValidator
        MemoryAmount: !Ref MemoryAmountValidator
        HealthCheckTimeout: !Ref HealthCheckTimeout
        HealthCheckInterval: !Ref HealthCheckInterval
        HealthyThresholdCount: !Ref HealthyThresholdCount
        UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
        AutoscalingStrategy: CUSTOM
        AutoscalingThreshold: !Ref AutoscalingThresholdValidator
        AutoscalingCheckPeriod: !Ref AutoscalingCheckPeriod
        MinTasksNumber: !Ref MinTasksNumberValidator
        MaxTasksNumber: !Ref MaxTasksNumberValidator
        AutoscalingDataPointN: !Ref AutoscalingDataPointValidatorN
        AutoscalingDataPointM: !Ref AutoscalingDataPointValidatorM
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        EfsFilesystem: !Ref FargateEFSFileSystemID
        MountEfs: !Ref MountEfs
        WireTapLogActivation: !Ref WireTapLogActivation
        ContainerImageURI: !Sub '${ContainerImageUri}'
        ContainerEnvEntry1: !Sub 'AWS_REGIONCODE=${AWS::Region}'
        ContainerEnvEntry2: !Sub 'PN_DELIVERYPUSHVALIDATOR_TOPICS_VALIDATIONACTIONS=${ScheduledValidationActionsQueueName}'
        ContainerEnvEntry3: !Sub 'PN_DELIVERYPUSHVALIDATOR_TOPICS_SAFESTORAGEEVENTS=${SafeStorageToDeliveryPushQueueName}'
        ContainerEnvEntry4: !Sub 'PN_DELIVERYPUSHVALIDATOR_TOPICS_ADDRESSMANAGEREVENTS=${AddressManagerToDeliveryPushQueueName}'
        ContainerEnvEntry5: !Sub 'PN_DELIVERYPUSHVALIDATOR_TOPICS_F24EVENTS=${F24ToDeliveryPushQueueName}'
        ContainerEnvEntry6: !Sub 'PN_DELIVERYPUSHVALIDATOR_TOPICS_DELIVERYVALIDATIONEVENTS=${DeliveryPushValidationInputsQueueName}'
        ContainerEnvEntry7: !Sub 'PN_DELIVERYPUSHVALIDATOR_DOCUMENTCREATIONREQUESTDAO_TABLENAME=${DocumentCreationRequestTableName}'
        ContainerEnvEntry8: !Sub 'PN_DELIVERYPUSHVALIDATOR_F24CXID=${F24DeliveryPushUser}'
        ContainerEnvEntry9: !Sub 'PN_DELIVERYPUSHVALIDATOR_F24BASEURL=http://${ApplicationLoadBalancerDomain}:8080'
        ContainerEnvEntry10: !Sub 'PN_DELIVERYPUSHVALIDATOR_SAFESTORAGEBASEURL=${SandboxSafeStorageBaseUrl}'
        ContainerEnvEntry11: !Sub 'PN_DELIVERYPUSHVALIDATOR_DELIVERYBASEURL=http://${ApplicationLoadBalancerDomain}:8080'
        ContainerEnvEntry12: !Sub 'PN_DELIVERYPUSHVALIDATOR_EXTERNALREGISTRYBASEURL=http://${ApplicationLoadBalancerDomain}:8080'
        ContainerEnvEntry13: !Sub 'PN_DELIVERYPUSHVALIDATOR_NATIONALREGISTRIESBASEURL=http://${ApplicationLoadBalancerDomain}:8080'
        ContainerEnvEntry14: !Sub 'PN_DELIVERYPUSHVALIDATOR_TEMPLATESENGINEBASEURL=http://${ApplicationLoadBalancerDomain}:8080'
        ContainerEnvEntry15: !Sub 'PN_DELIVERYPUSHVALIDATOR_TIMELINECLIENTBASEURL=http://${ApplicationLoadBalancerDomain}:8080'
        ContainerEnvEntry16: !Sub 'PN_DELIVERYPUSHVALIDATOR_ACTIONMANAGERBASEURL=http://${ApplicationLoadBalancerDomain}:8080'
        ContainerEnvEntry17: !Sub 'PN_DELIVERYPUSHVALIDATOR_DELIVERYPUSHBASEURL=http://${ApplicationLoadBalancerDomain}:8080'
        ContainerEnvEntry18: !Sub 'PN_CRON_ANALYZER=${PnCronAnalyzer}'
        ContainerEnvEntry19: !Sub 'WIRE_TAP_LOG=${WireTapLogActivation}'
        ContainerSecret1: !Sub 'PN_DELIVERYPUSHVALIDATOR_ADDRESSMANAGERAPIKEY=arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pn-DeliveryPush-Secrets:AddressManagerApiKey:AWSCURRENT:'
        ApplicativeEnvFileChecksum: !Ref ApplicativeEnvFileChecksum
        MicroServiceSecretPrefix: pn-DeliveryPush-Secrets
        ParentMicroserviceName: !Sub '${ProjectName}-delivery-push-validator'
        JavaToolOptions: '-Dreactor.netty.ioWorkerCount=50'
        MappedPaths: '/delivery-push-validator-not-available'
        ECSClusterName: !Ref ECSClusterName
        Subnets: !Join [ ',', !Ref SubnetsIds ]
        VpcId: !Ref VpcId
        EcsDefaultSecurityGroup: !Ref EcsDefaultSecurityGroup
        LoadBalancerListenerArn: !Ref ApplicationLoadBalancerListenerArn
        LoadbalancerRulePriority: !Ref MicroserviceNumber
        TaskRoleManagedPolicyArn: !Ref DeliveryPushValidatorMicroserviceTaskManagedPolicy
        AlbSecurityGroup: !Ref AlbSecurityGroup
        EcsLogGroup: !Ref EcsValidatorLogGroup
        LogAlarmStrategyV1: !Ref LogAlarmStrategy

  ## Dashboard
  DeliveryPushValidatorMicroserviceCloudWatchDashboard:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/microservice-cloudwatch-dashboard.yaml"
      Parameters:
        DashboardName: !Sub "${ProjectName}-delivery-push-validator-service"
        DynamoDBTableNames: !Join
          - ','
          - - !Ref DocumentCreationRequestTableName
        AlarmArns: !Join
          - ','
          - - !GetAtt DeliveryPushValidatorMicroservice.Outputs.FatalLogsMetricAlarmArn
            - !Ref DeliveryPushValidationInputsQueueAlarmARN
            - !Ref DeliveryPushValidationInputsQueueAgeAlarmARN
            - !Ref SafeStorageToDeliveryPushQueueAlarmARN
            - !Ref SafeStorageToDeliveryPushQueueAgeAlarmARN
            - !Ref ScheduledValidationActionsQueueAlarmARN
            - !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ScheduledValidationActionsQueueName}-HasOldMessage
            - !Ref AddressManagerToDeliveryPushQueueAlarmARN
            - !Ref AddressManagerToDeliveryPushQueueAgeAlarmARN
            - !Ref F24ToDeliveryPushQueueAlarmARN
            - !Ref F24ToDeliveryPushQueueAgeAlarmARN
        QueueArns: !Join
          - ','
          - - !Ref DeliveryPushValidationInputsQueueARN
            - !Ref SafeStorageToDeliveryPushQueueARN
            - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${ScheduledValidationActionsQueueName}
            - !Ref AddressManagerToDeliveryPushQueueARN
            - !Ref F24ToDeliveryPushQueueARN
        LogGroupsNames: !Join
          - ','
          - - !Sub '/aws/ecs/${ProjectName}-delivery-push-validator'

  #### Alarm for custom metric Autoscaling
  AlarmCustomAutoscalingValidator:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "${ProjectName}-delivery-push-validator-service-autoscaling-custom"
      AlarmDescription: "Trigger scaling based on custom metric"
      DatapointsToAlarm: !Ref AutoscalingDataPointValidatorN
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      Metrics:
        - Id: m1
          MetricStat:
            Metric:
              Dimensions:
                - Name: QueueName
                  Value: !Ref "DeliveryPushValidationInputsQueueName"
              Namespace: "AWS/SQS"
              MetricName: "ApproximateNumberOfMessagesVisible"
            Period: !Ref AutoscalingCheckPeriod
            Stat: Average
          ReturnData: False
        - Id: m2
          MetricStat:
            Metric:
              Dimensions:
                - Name: QueueName
                  Value: !Ref "ScheduledValidationActionsQueueName"
              Namespace: "AWS/SQS"
              MetricName: "ApproximateNumberOfMessagesVisible"
            Period: !Ref AutoscalingCheckPeriod
            Stat: Average
          ReturnData: False
        - Id: m3
          MetricStat:
            Metric:
              Dimensions:
                - Name: QueueName
                  Value: !Ref "SafeStorageToDeliveryPushQueueName"
              Namespace: "AWS/SQS"
              MetricName: "ApproximateNumberOfMessagesVisible"
            Period: !Ref AutoscalingCheckPeriod
            Stat: Average
          ReturnData: False
        - Id: m4
          MetricStat:
            Metric:
              Dimensions:
                - Name: QueueName
                  Value: !Ref "AddressManagerToDeliveryPushQueueName"
              Namespace: "AWS/SQS"
              MetricName: "ApproximateNumberOfMessagesVisible"
            Period: !Ref AutoscalingCheckPeriod
            Stat: Average
          ReturnData: False
        - Id: m5
          MetricStat:
            Metric:
              Dimensions:
                - Name: QueueName
                  Value: !Ref "F24ToDeliveryPushQueueName"
              Namespace: "AWS/SQS"
              MetricName: "ApproximateNumberOfMessagesVisible"
            Period: !Ref AutoscalingCheckPeriod
            Stat: Average
          ReturnData: False
        - Id: m6
          MetricStat:
            Metric:
              Dimensions:
                - Name: TargetGroup
                  Value: !GetAtt DeliveryPushValidatorMicroservice.Outputs.TargetGroupName
                - Name: LoadBalancer
                  Value: !Ref ApplicationLoadBalancerMetricsDimensionName
              Namespace: "AWS/ApplicationELB"
              MetricName: "HealthyHostCount"
            Period: !Ref AutoscalingCheckPeriod
            Stat: Average
          ReturnData: False
        - Id: code
          Expression: !Sub "IF(m6==0, 101, (100*(m1+m2+m3+m4+m5)) / (${ConsumedQueueMessagePerMinuteValidator} * m6) )"
          Label: !Sub "${ProjectName}-delivery-push-queue-validator-custom-metric"
          ReturnData: False
        - Id: e1
          Expression: "code"
          Label: !Sub "${ProjectName}-delivery-push-autoscale-validator-custom-metric"
      EvaluationPeriods: !Ref AutoscalingDataPointValidatorM
      Threshold: 60
      AlarmActions:
        - !GetAtt DeliveryPushValidatorMicroservice.Outputs.ScaleUpPolicy
      OKActions:
        - !GetAtt DeliveryPushValidatorMicroservice.Outputs.ScaleDownPolicy

  # Grant operational rights to PN-Delivery-push-validator microservice
  DeliveryPushValidatorMicroserviceTaskManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:ChangeMessageVisibilityBatch
              - sqs:DeleteMessage
              - sqs:DeleteMessageBatch
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ReceiveMessage
              - sqs:SendMessage
              - sqs:SendMessageBatch
            Resource:
              - !Ref DeliveryPushValidationInputsQueueARN
              - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${ScheduledValidationActionsQueueName}
              - !Ref SafeStorageToDeliveryPushQueueARN
              - !Ref AddressManagerToDeliveryPushQueueARN
              - !Ref F24ToDeliveryPushQueueARN
          - Effect: Allow
            Action:
              - 'ssm:GetParameter'
              - 'ssm:GetParameters'
            Resource:
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/MapPaSendMoreThan20Grams'
          - Effect: Allow
            Action:
              - 'dynamodb:GetItem'
              - 'dynamodb:PutItem'
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DocumentCreationRequestTableName}

  EventBusEnqueueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
        Version: "2012-10-17"
      Policies:
        - PolicyName: !Sub ${ProjectName}-actionmanager-2-validationactionqueue-eventBusRulePolicy
          PolicyDocument:
            Statement:
              - Sid: putEvents
                Action:
                  - sqs:SendMessage
                Effect: Allow
                Resource:
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${ScheduledValidationActionsQueueName}

  PnCoreEventBusActionManagerToValidationActionsQueueRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Route ActionManager events to scheduled validation actions queue
      RoleArn: !GetAtt "EventBusEnqueueRole.Arn"
      EventBusName: !Sub '${ProjectName}-CoreEventBus'
      EventPattern:
        detail-type: ["ActionManagerEventOutcome"]
        detail:
          routingActionType: !Ref ValidationActionQueueDetailType
      Targets:
        - Id: !Sub '${ProjectName}-CoreEventBus-ActionManager2ValidationActionQueue'
          Arn: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${ScheduledValidationActionsQueueName}
          InputPath: $.detail.body
          DeadLetterConfig:
            Arn: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:pn-CoreEventBus-DLQ

  ScheduledActionsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Sub https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${ScheduledValidationActionsQueueName}
      PolicyDocument:
        Statement:
          - Sid: AllowEventBridgeToSendMessage
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${ScheduledValidationActionsQueueName}
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt PnCoreEventBusActionManagerToValidationActionsQueueRule.Arn