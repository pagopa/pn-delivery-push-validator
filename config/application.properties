logging.config=config/logback-local.xml

spring.application.name=pn-delivery-push-validator

# Runtime mode
pn.env.runtime=DEVELOPMENT
#pn.env.runtime=PROD

spring.cloud.aws.credentials.profile-name=${PN_AWS_PROFILE_NAME:default}
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.endpoint=http://localhost:4566

pn.delivery-push-validator.document-creation-request-dao.table-name=DocumentCreationRequest

# Queue SQS configurations
pn.delivery-push-validator.topics.delivery-validation-events=local-delivery-push-inputs.fifo
pn.delivery-push-validator.topics.safe-storage-events=local-safe-storage-inputs
pn.delivery-push-validator.topics.validation-actions=local-validation-actions-inputs
pn.delivery-push-validator.topics.address-manager-events=local-address-manager-inputs
pn.delivery-push-validator.topics.f24-events=local-f24-inputs
spring.cloud.aws.sqs.enabled=true

pn.delivery-push-validator.delivery-base-url=http://localhost:8080
pn.delivery-push-validator.data-vault-base-url=http://localhost:8084
pn.delivery-push-validator.safe-storage-base-url=http://localhost:8120
pn.delivery-push-validator.external-registry-base-url=http://localhost:8087
pn.delivery-push-validator.national-registries-base-url=http://localhost:1080
pn.delivery-push-validator.address-manager-base-url=http://localhost:8090
pn.delivery-push-validator.action-manager-base-url=http://localhost:8090
pn.delivery-push-validator.templates-engine-base-url=http://localhost:8090
pn.delivery-push-validator.timeline-client-base-url=http://localhost:8091

pn.delivery-push-validator.address-manager-api-key="testApiKey"

### VALIDATION CHANNELS ###
### CHANNEL pnDeliveryNewNotificationEventConsumer ###
spring.cloud.stream.bindings.pnDeliveryNewNotificationEventConsumer-in-0.destination=local-delivery-push-validation-inputs
spring.cloud.stream.sqs.bindings.pnDeliveryNewNotificationEventConsumer-in-0.consumer.snsFanout=false
spring.cloud.stream.sqs.bindings.pnDeliveryNewNotificationEventConsumer-in-0.consumer.maxNumberOfMessages=10
spring.cloud.stream.bindings.pnDeliveryNewNotificationEventConsumer-in-0.consumer.concurrency=1
### CHANNEL pnDeliveryPushValidationActionsInboundConsumer ###
spring.cloud.stream.bindings.pnDeliveryPushValidationActionsInboundConsumer-in-0.destination=local-delivery-push-validation-actions
spring.cloud.stream.sqs.bindings.pnDeliveryPushValidationActionsInboundConsumer-in-0.consumer.snsFanout=false
spring.cloud.stream.sqs.bindings.pnDeliveryPushValidationActionsInboundConsumer-in-0.consumer.maxNumberOfMessages=10
spring.cloud.stream.bindings.pnDeliveryPushValidationActionsInboundConsumer-in-0.consumer.concurrency=1
### CHANNEL pnSafeStorageEventInboundConsumer ###
spring.cloud.stream.bindings.pnSafeStorageEventInboundConsumer-in-0.destination=local-delivery-push-safestorage-inputs
spring.cloud.stream.sqs.bindings.pnSafeStorageEventInboundConsumer-in-0.consumer.snsFanout=false
spring.cloud.stream.sqs.bindings.pnSafeStorageEventInboundConsumer-in-0.consumer.maxNumberOfMessages=10
spring.cloud.stream.bindings.pnSafeStorageEventInboundConsumer-in-0.consumer.concurrency=1
### CHANNEL pnAddressManagerEventInboundConsumer ###
spring.cloud.stream.bindings.pnAddressManagerEventInboundConsumer-in-0.destination=local-address-manager-to-delivery-push
spring.cloud.stream.sqs.bindings.pnAddressManagerEventInboundConsumer-in-0.consumer.snsFanout=false
spring.cloud.stream.sqs.bindings.pnAddressManagerEventInboundConsumer-in-0.consumer.maxNumberOfMessages=10
spring.cloud.stream.bindings.pnAddressManagerEventInboundConsumer-in-0.consumer.concurrency=1
### CHANNEL pnF24EventInboundConsumer ###
spring.cloud.stream.bindings.pnF24EventInboundConsumer-in-0.destination=pn-f24_to_deliverypush
spring.cloud.stream.sqs.bindings.pnF24EventInboundConsumer-in-0.consumer.snsFanout=false
spring.cloud.stream.sqs.bindings.pnF24EventInboundConsumer-in-0.consumer.maxNumberOfMessages=10
spring.cloud.stream.bindings.pnF24EventInboundConsumer-in-0.consumer.concurrency=1

# Enables retry of the notification validation in case of SafeStorage 404 error
pn.delivery-push-validator.safeStorageFileNotFoundRetry=false

pn.delivery-push-validator.timeline-client-enabled-start-date=2025-06-13T15:13:00Z

#Time to live delle action 0d significa disabilitato
pn.delivery-push-validator.action-ttl-days=1095

#Feature flag per attivazione invio solo AAR per PEC con copertura RADD e PF
pn.delivery-push-validator.AAROnlyPECForRADDAndPF=${PN_DELIVERY_PUSH_AARONLYPECFORRADDANDPF}

pn.delivery-push-validator.templateURLforPEC=${PN_DELIVERY_PUSH_TEMPLATEURLFORPEC:/templates-engine-private/v1/templates/notification-aar-for-pec}

# Attachment retention after validation.
# Note: This number is defined on safeStorage, so a change to these properties does not imply a change to effective file retention
pn.delivery-push-validator.time-params.attachment-retention-time-after-validation=120d

# Defines how long before the attachment retention expires need to start "check attachment retention"
pn.delivery-push-validator.time-params.check-attachment-time-before-expiration=10d

# Time to add when attachment retention is expiring
pn.delivery-push-validator.time-params.attachment-retention-time-to-add-after-expiration=120d

pn.delivery-push-validator.feature-unreachable-refinement-postAARStartDate=2024-11-27T00:00:00Z


pn.delivery-push-validator.error-correction-level-qr-code=h